<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161d2c'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 8' stroke='%23ff5c6c' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <title>肉鸽炒股 · Demo v0.9</title>
    <style>:root {
  --bg: #0f1420;
  --panel: #161d2c;
  --panel2: #1d2638;
  --line: #2a3549;
  --text: #e6ecf5;
  --muted: #8fa1bd;
  --up: #ff5c6c;
  --down: #35d07f;
  --gold: #f2c14e;
  --accent: #4c8dff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 600px at 20% -10%, #1a2740 0%, var(--bg) 60%);
  color: var(--text);
  font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}
button {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input {
  background: #0c111c; color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; font: inherit; width: 100%;
}
#app { max-width: 1280px; margin: 0 auto; padding: 12px; }
.topbar {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
}
.brand { font-weight: 700; font-size: 16px; }
.brand span { color: var(--muted); font-weight: 400; font-size: 12px; }
.stat { display: flex; flex-direction: column; min-width: 70px; }
.stat label { color: var(--muted); font-size: 12px; }
.stat b { font-size: 15px; }
.mood { display: flex; flex-direction: column; min-width: 160px; }
.mood label { color: var(--muted); font-size: 12px; }
.moodbar { height: 8px; background: #0a0f18; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.moodbar span { display: block; height: 100%; transition: width .3s; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; margin-top: 12px; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 8px; }
.panel-head h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font-size: 12px; padding: 3px 8px; }
.filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid #202a3c; vertical-align: top; }
tr.held td { background: #1a2333; }
.sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
.badge { display: inline-block; font-size: 10px; padding: 0 5px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); margin-right: 4px; }
.badge.evt { color: var(--gold); border-color: #5c4a1e; }
.ops { white-space: nowrap; }
.ops button { padding: 3px 8px; font-size: 12px; margin-right: 4px; }
.up { color: var(--up); }
.down { color: var(--down); }
.bad { color: #ff8a8a; }
.empty { color: var(--muted); font-size: 12px; padding: 10px; }
.events { display: flex; flex-direction: column; gap: 8px; }
.event-card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; background: var(--panel2); }
.event-card.good { border-left-color: var(--up); }
.event-card.bad { border-left-color: var(--down); }
.evt-head { display: flex; gap: 6px; align-items: baseline; }
.evt-head b { font-size: 13px; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 6px; background: #24304a; color: var(--muted); }
.evt-body { font-size: 12px; color: var(--muted); margin-top: 3px; }
.evt-brief { font-size: 12px; margin-top: 2px; }
.positions { display: flex; flex-direction: column; gap: 8px; }
.pos { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel2); }
.pos-head { display: flex; justify-content: space-between; align-items: center; }
.pos-body { font-size: 12px; color: var(--muted); margin: 4px 0; }
.pos-ops button { padding: 3px 8px; font-size: 12px; margin-right: 4px; }
.relics { display: flex; flex-direction: column; gap: 6px; }
.relic { display: flex; gap: 8px; align-items: center; font-size: 12px; border-bottom: 1px dashed #202a3c; padding-bottom: 4px; }
.relic span { color: var(--muted); flex: 1; }
.log { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; max-height: 140px; overflow: auto; }
.bottombar {
  display: flex; gap: 8px; align-items: center; margin-top: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.overlay { position: fixed; inset: 0; background: rgba(5, 8, 14, .65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { width: min(720px, 96vw); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-body { padding: 12px 14px; }
.modal-ops { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.form { display: flex; flex-direction: column; gap: 6px; }
.form label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.form .hint { margin-left: 0; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.shop-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel2); display: flex; flex-direction: column; gap: 6px; }
.shop-item.green { border-color: #2f7a4a; }
.shop-item.blue { border-color: #2f5f9a; }
.shop-item.purple { border-color: #6a3f9a; }
.shop-item.gold { border-color: var(--gold); box-shadow: 0 0 12px rgba(242,193,78,.25); }
.shop-item.relic { border-color: #4a5a7a; }
.shop-item.pack { border-style: dashed; }
.shop-item.bought { opacity: .5; }
.si-head { display: flex; justify-content: space-between; gap: 6px; }
.si-desc { color: var(--muted); font-size: 12px; flex: 1; }
.price { color: var(--gold); font-size: 12px; }
.pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.targets button { text-align: left; }
.inv { display: flex; flex-direction: column; gap: 8px; }
.inv-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel2); }
.inv-item.green { border-left: 3px solid #2f7a4a; }
.inv-item.blue { border-left: 3px solid #2f5f9a; }
.inv-item.purple { border-left: 3px solid #6a3f9a; }
.inv-item.gold { border-left: 3px solid var(--gold); }
.summary { display: flex; flex-direction: column; gap: 6px; }
.help p { margin: 6px 0; font-size: 13px; color: var(--muted); }
.tab { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
#toast-host { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 99; }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; animation: fade .2s; }
.toast.good { border-color: #2f7a4a; }
.toast.bad { border-color: #a33; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* ===== v0.2 新增样式 ===== */
.brand { display: flex; align-items: center; gap: 8px; }
.brand .logo { display: inline-flex; }
.brand b { font-size: 16px; }
.brand .ver { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.mood-block { display: flex; flex-direction: column; gap: 3px; min-width: 190px; padding: 4px 10px; border-left: 1px solid var(--line); }
.mood-top { display: flex; justify-content: space-between; align-items: baseline; }
.mood-top span { color: var(--muted); font-size: 12px; }
.mood-top b { font-size: 20px; line-height: 1; }
.moodbar { height: 10px; background: #0a0f18; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.moodbar span { display: block; height: 100%; transition: width .35s; }
.dots { display: flex; align-items: center; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #3a4761; transition: all .25s; }
.dots i.on { background: var(--gold); box-shadow: 0 0 6px rgba(242,193,78,.7); }
.dots i.off { background: #242c3d; }
.dots span { color: var(--muted); font-size: 11px; margin-left: 4px; }
.stockname { color: var(--text); text-decoration: none; cursor: pointer; border-bottom: 1px dashed #3a4761; }
.stockname:hover { color: var(--accent); border-bottom-color: var(--accent); }
.pos.danger { border-color: #a33; box-shadow: 0 0 0 1px rgba(170,51,51,.35) inset; }
button.danger { background: #4a1e24; border-color: #a33; color: #ffb3b3; }
button.danger:hover { border-color: #ff6b6b; }
.start-overlay { background: radial-gradient(900px 500px at 50% 0%, #1c2a45 0%, #090d15 70%); }
.start-modal { width: min(820px, 96vw); }
.start-brand { text-align: center; padding: 12px 0 6px; }
.start-brand h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: 2px; }
.start-brand p { margin: 0; color: var(--muted); }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 8px; }
@media (max-width: 720px) { .mode-grid { grid-template-columns: 1fr; } }
.mode-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--panel2); display: flex; flex-direction: column; gap: 8px; }
.mode-card h3 { margin: 0; font-size: 18px; }
.mode-card.thrill { border-color: #6a3f9a; box-shadow: 0 0 18px rgba(138,79,255,.15); }
.mode-tag { margin: 0; color: var(--gold); font-size: 12px; }
.mode-card ul { margin: 4px 0 8px; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.mode-card ul b { color: var(--text); }
.mode-card button { margin-top: auto; }
.start-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
.events-modal { width: min(680px, 96vw); }
.events.big .event-card { padding: 14px 16px; }
.events.big .evt-head b { font-size: 16px; }
.events.big .evt-body { font-size: 13px; }
.events.big .evt-brief { font-size: 13px; color: var(--muted); }
.chart-wrap { background: #0c111c; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.kline { width: 100%; height: auto; display: block; border-radius: 8px; }
.chart-info { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; color: var(--muted); font-size: 13px; }
.chart-info b { color: var(--text); }
.chart-changes { margin-top: 8px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.trade-line { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.trade-line b { color: var(--text); }
.liq p { margin: 4px 0; }
.liq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.liq-grid div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; color: var(--muted); }
.liq-grid b { color: var(--text); display: block; margin-top: 2px; font-size: 15px; }
.danger-modal { border-color: #a33; }
.toast.good { border-color: #2f7a4a; }
.toast.bad { border-color: #a33; }

/* v0.3 难度选择 */
.diff-row { display: flex; gap: 6px; align-items: center; justify-content: center; margin: 6px 0 4px; flex-wrap: wrap; }
.diff-row span { color: var(--muted); font-size: 12px; margin-right: 4px; }
.diff-row button { min-width: 44px; padding: 4px 8px; font-size: 12px; }
.diff-row button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.diff-note { color: var(--muted); font-size: 12px; text-align: center; margin: 0 0 6px; }

/* ===== v0.4 移动端适配 ===== */
.market-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; max-width: 100%; }
@media (max-width: 760px) {
  #app { padding: 8px; }
  .topbar { gap: 8px 12px; padding: 8px 10px; }
  .brand b { font-size: 15px; }
  .topbar .stat { min-width: 56px; }
  .stat b { font-size: 14px; }
  .mood-block { order: 10; min-width: 100%; border-left: 0; border-top: 1px solid var(--line); padding: 6px 0 0; }
  .tools { margin-left: 0; width: 100%; justify-content: flex-end; }
  .layout { gap: 8px; margin-top: 8px; }
  .panel { padding: 8px 10px; }
  .market-scroll table { min-width: 520px; }
  th, td { padding: 5px 4px; font-size: 12px; }
  .ops button { padding: 5px 7px; }
  .bottombar { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
  .bottombar button { flex: 1 1 auto; min-height: 38px; }
  .bottombar .hint { margin-left: 0; width: 100%; }
  button { min-height: 32px; }
  .ops button, .pos-ops button, .filters button { min-height: 0; }
  .overlay { padding: 8px; }
  .modal { width: 100%; max-height: 92vh; border-radius: 12px; }
  .modal-ops { flex-wrap: wrap; justify-content: stretch; }
  .modal-ops button { flex: 1 1 45%; min-height: 40px; }
  .liq-grid { grid-template-columns: 1fr; }
  .chart-info { gap: 10px; font-size: 12px; }
  .start-brand h1 { font-size: 22px; }
  .mode-card { padding: 12px; }
  .mode-card ul { font-size: 12px; }
  .start-modal { width: 100%; }
  .shop-grid { grid-template-columns: 1fr 1fr; }
  #toast-host { left: 8px; right: 8px; bottom: 8px; }
  .toast { font-size: 12px; }
}
@media (max-width: 430px) {
  .shop-grid, .pack-grid, .targets { grid-template-columns: 1fr; }
  .diff-row button { min-width: 36px; padding: 4px 6px; }
  .topbar .stat { min-width: 48px; }
  .stockname { border-bottom-color: var(--accent); }
}
@media (hover: none) {
  .stockname { border-bottom-color: var(--accent); }
  button:hover { border-color: var(--line); }
}

/* ===== v0.5 组件补充 ===== */
.sidecol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mobile-tabs { display: none; }
.save-row { text-align: center; margin: 10px 0 4px; }
.input-row { display: flex; gap: 6px; align-items: center; }
.input-row input { flex: 1; }
.input-row button { min-height: 34px; white-space: nowrap; }
.trade-est { font-size: 12px; color: var(--muted); margin: 6px 0; line-height: 1.6; }
.trade-est b { color: var(--text); }
.quick-row { display: flex; gap: 6px; margin-top: 6px; }
.quick-row button { flex: 1; min-height: 34px; }
.diff-detail { max-width: 640px; margin: 6px auto 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 10px 12px; text-align: left; }
.diff-detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.diff-detail-head b { font-size: 14px; }
.diff-detail-head span { color: var(--muted); font-size: 12px; }
.diff-detail ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
.diff-detail ul li b { color: var(--text); }
.diff-sum { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.diff-sum summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.save-code { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 8px 0 2px; font-size: 12.5px; color: var(--muted); }
.save-code b { color: var(--gold); letter-spacing: 2px; font-size: 15px; padding: 2px 8px; border: 1px dashed #5c4a1e; border-radius: 8px; }
.save-code button { min-height: 30px; font-size: 12px; }
.save-row button { min-height: 40px; padding: 8px 16px; border-color: var(--gold); color: var(--gold); }
.evt-hint { margin-top: 4px; font-size: 12px; color: var(--gold); }
.comp { font-size: 12px; color: var(--gold); margin-top: 2px; }
.draft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.draft-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }
.draft-card:hover { border-color: var(--accent); }
.draft-card.rare { border-color: #2f5f9a; }
.draft-card.epic { border-color: #6a3f9a; box-shadow: 0 0 10px rgba(138,79,255,.18); }
.draft-card .rarity { font-size: 11px; color: var(--muted); }
.draft-card .draft-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }

/* ===== v0.5 移动端：行情卡片化 + 分页 + 吸底操作栏 ===== */
@media (max-width: 760px) {
  .layout { display: block; }
  .sidecol { display: contents; }
  .mobile-tabs {
    display: flex; gap: 6px; margin-top: 8px; position: sticky; top: 0; z-index: 20;
    background: rgba(15, 20, 32, .92); backdrop-filter: blur(6px); padding: 6px 0;
  }
  .mobile-tabs button { flex: 1; min-height: 38px; font-size: 13px; }
  .mobile-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .m-tab, .m-events, .m-holdings { display: none; }
  .m-tab.active, .m-events.active, .m-holdings.active { display: block; }
  .market-scroll { overflow: visible; }
  .market-scroll table, .market-scroll thead, .market-scroll tbody, .market-scroll tr, .market-scroll td, .market-scroll th { display: block; }
  .market-scroll thead { display: none; }
  .market-scroll table { min-width: 0; }
  .market-scroll tr {
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px;
    background: var(--panel2); position: relative;
  }
  .market-scroll tr.held { border-color: var(--gold); }
  .market-scroll td { border: 0; padding: 2px 0; font-size: 13px; }
  .market-scroll td:first-child { font-size: 15px; font-weight: 600; }
  .market-scroll td:nth-child(2) { color: var(--muted); font-size: 12px; }
  .market-scroll td:nth-child(3) { font-size: 16px; }
  .market-scroll td:nth-child(4) { color: var(--muted); font-size: 12px; }
  .market-scroll td.ops { display: flex; gap: 6px; margin-top: 8px; }
  .market-scroll td.ops button { flex: 1; min-height: 40px; font-size: 14px; margin: 0; }
  .bottombar {
    position: sticky; bottom: 0; z-index: 30; margin-top: 8px;
    background: rgba(22, 29, 44, .97); backdrop-filter: blur(8px);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, .45); padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .bottombar button { min-height: 44px; font-size: 14px; }
  .bottombar .hint { display: none; }
  .modal { max-height: 94vh; }
  .modal-head { position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .modal-ops { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; }
  .draft-grid { grid-template-columns: 1fr; }
  .draft-card { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .draft-card b { flex: 1 1 auto; }
  .draft-card .draft-desc { flex: 1 1 100%; }
  .pos-head { font-size: 14px; }
  .pos-ops { display: flex; gap: 6px; }
  .pos-ops button { flex: 1; min-height: 40px; }
  .inv-item { flex-wrap: wrap; }
  .inv-item button { min-height: 40px; }
  .events.big .event-card { padding: 10px 12px; }
}
@media (max-width: 430px) {
  .market-scroll tr { padding: 8px; }
  .bottombar button { font-size: 13px; }
  .topbar .brand .ver { font-size: 10px; }
}

.codex-list { display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow: auto; padding-right: 4px; }
